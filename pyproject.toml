[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-sentinel"
version = "0.1.0"
description = "Explainable, testable security-event correlation engine"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[tool.setuptools.packages.find]
where = ["src"]
